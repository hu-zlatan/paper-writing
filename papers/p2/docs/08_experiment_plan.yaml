# p2 Stage 9 · EXPERIMENT_DESIGN [GATE] — v1 (2026-11-08, run 37)
# Template: pipeline/references/stage_prompts/experiment_design.md, verbatim (system "You are a principal investigator
# designing ML experiments."; user "{preamble} Design an experiment plan as YAML. Required keys: objectives, datasets,
# baselines, proposed_methods, ablations, metrics, risks, compute_budget. Hypotheses: {hypotheses}"), preamble empty
# (first pass), hypotheses = docs/07_hypotheses.md (canonical; section numbers below refer to it).
# STATUS: design approved at the gate; NOT yet the pre-registration freeze. Values marked `pilot:` are set by the
# stage-10/12 pilot (07_hypotheses §8) and frozen in docs/08b_preregistration.md before any non-pilot data exist.
# Nothing here is a result.

objectives:
  - id: C1
    claim: "Touch lowers grip force at a matched, guaranteed slip rate relative to the best non-tactile conformal method"
    hypotheses: [H1 (gate + physical validity), H2 (primary endpoint)]
  - id: C2
    claim: "Online quantile tracking from binary slip feedback restores alpha under shift at <= 10 % force cost vs label-requiring recalibration"
    hypotheses: [H3]
  - secondary: [H1c, H1-V(COMP, CSF-1, alpha 0.05), H2-T, H2-C, H2-n, H2-H, H2-M, H2-R, H3-B, H3-L, H3-S, H4a, H4b, H4c, H4d]
  - exploratory: [E1 group coverage, E2 ACI vs OQT, E3 correlated streams, E4 gradual drift, E5 hardware calibration routes, E6 slip-threshold sensitivity, E7 efficiency frontier]
  - multiplicity: "3 core decisions, Bonferroni one-sided 0.0167 each (two-sided 96.7 % CI*); Holm 5 % within each secondary family; exploratory uncorrected and labelled"

datasets:
  simulator:
    engine: "pip mujoco 4.x (version pinned in papers/p2/code/requirements.txt; 4.0.0 smoke-tested 2026-11-08)"
    gripper: "parallel jaw, position-controlled approach, force-controlled closing axis; touch_grid array per pad"
    physics_identity: "timestep, solver, cone, condim, solref/solimp identical for all families and shifts (UT7)"
    protocol: "preload F0 (constant) -> 5 mm lift + 0.2 s hold -> probe squeeze F0->1.5F0->F0 (0.3 s) -> ramp to chosen F + 0.1 s -> disturbance window (07_hypotheses §1.1)"
    slip_metric: "tangential displacement in pad plane > delta_t OR rotation about grasp axis > 3 deg OR loss of contact; delta_t pilot: (2 mm assumed), frozen before any monotonicity data (UT9)"
    label: "F* by log-space bisection on [F_min, F_max] = [0.1, 100] N (pilot: F_max per UT8), 1 + 10 replays; store F*_lo, F*_hi, F*_mid = sqrt(lo*hi)"
  families: {F1: boxes, F2: cylinders, F3: ellipsoids/capsules, F4: two-body composites with off-centre CoM, F5_shift_only: thin plates and disks (same primitives)}
  ranges: {mu: "log-uniform [0.3, 1.0]", mass_kg: "log-uniform [0.05, 1.0]", com_offset: "U[0, 0.4] half-extent (F4: 0.6)", D1_lift_acc: "U[1, 10] m/s^2", D2_shake: "amp U[5, 20] mm, freq U[2, 5] Hz", D3_pull: "U[0.5, 2] m g", D4_payload: "U[0.2, 1.0] m"}
  in_distribution_pool: "4 families x 500 objects x 1 instance per disturbance type = 8,000 labelled instances; split by object per family 250 train (20 % held out as selection split) / 125 calibration / 125 test"
  calibration: "stratified by disturbance type; one instance per object per stratum (object-level exchangeability); n_cal per stratum in {50, 150, 500}"
  shift_pools:
    S1: "mu x 0.6, paired re-simulation of the 2,000 test instances"
    S1m: "mu x 0.9, paired (secondary)"
    S3: "all disturbance amplitudes x 1.5, paired"
    S2: "family F5, 500 new objects x 4 disturbances"
    split: "125 objects oracle calibration / 375 objects stream (disjoint)"
  streams: "T = 2,000: 500 in-distribution then 1,500 shifted steps; 20 orderings per shift (Monte-Carlo replicates); alpha = 0.10"
  seeds: "object/instance salts per split (disjoint, UT1); predictor seeds 5; bootstrap 2,000 object-cluster draws"
  provenance: "all data generated by papers/p2/code in this repo; sources recorded in papers/p2/data/README.md"

baselines:
  - name: CSF-1
    description: "nominal force F_nom = m(g + a_cmd)/(2 mu_bar) (D1/D2) or m g/(2 mu_bar) (D3/D4), one conformal factor exp(q_hat) per disturbance stratum"
    inputs: [disturbance type, commanded amplitude (D1/D2), mass]
    tuning_protocol: "no free parameters beyond q_hat (calibrated); mu_bar fixed to the geometric mean of the mu range"
  - name: Mondrian-CSF
    description: "CSF with one q_hat per family x disturbance cell (16 cells) — given privileged true family ID"
    inputs: [CSF-1 inputs, family ID (privileged)]
    tuning_protocol: "calibrated per cell; no other parameters"
  - name: CertGrip-P (no-touch learned conformal)
    description: "same CQR pipeline as CertGrip with proprioceptive features only (aperture at contact, measured preload force) + mass + disturbance info"
    tuning_protocol: "gradient-boosted quantile trees; 30-config random search, 4-fold object-grouped CV on train objects — identical budget for every input set"
  - name: COMP (primary comparator)
    description: "the better of Mondrian-CSF and CertGrip-P by mean relative excess at alpha 0.10 on the selection split; chosen once, logged and frozen before calibration/test access"
  - name: RAW-Q / RAW-Qv / RAW-G (uncalibrated targeters, H1c)
    description: "quantile model at tau = 1-alpha; tau tuned on selection split to hit alpha; Gaussian mu + z sigma"
    tuning_protocol: "same 30-config search; RAW-Qv tau by bisection on the selection split"
  - name: Oracle ceiling (reference, not a baseline)
    description: "CQR on privileged features (mu, amplitude, CoM offset, geometry, mass)"
  - name: Oracle-recalibration (H3 reference)
    description: "split conformal re-run on 500 labelled instances of the shifted pool (125 oracle objects); not deployable"
  - name: Frozen-CertGrip / Frozen-COMP (H3)
    description: "offline q_hat kept fixed through the shift"

proposed_methods:
  - name: CertGrip (offline)
    components:
      - id: PM1_learned_quantile_predictor
        what: "gradient-boosted quantile trees g_tau(x), tau = 1 - alpha"
      - id: PM2_static_touch_features
        what: "touch_grid pad readings at the lifted preload + preload-slip flag"
      - id: PM3_probe_squeeze_features
        what: "pad-reading response to the F0 -> 1.5F0 -> F0 probe"
      - id: PM4_conformal_calibration
        what: "one-sided multiplicative CQR score s = log F*_hi - log g_tau(x); q_hat = ceil((n+1)(1-alpha))-th score"
      - id: PM5_disturbance_stratification
        what: "q_hat per disturbance stratum (Mondrian over a known task variable)"
      - id: PM6_multiplicative_score
        what: "log-space score (scale-equivariant) instead of additive newtons"
    decision: "F = min(F_max, g_tau(x) exp(q_hat))"
  - name: CertGrip-online (OQT)
    components:
      - id: PM7_score_space_tracking
        what: "q_{t+1} = q_t + eta (slip_t - alpha), observing only the binary slip outcome"
      - id: PM8_constant_step
        what: "eta = 0.1 x IQR of in-distribution calibration scores at alpha 0.10 (pilot: value)"
      - id: PM9_anti_windup
        what: "no update on steps where F_t = F_max"
      - id: PM10_warm_start
        what: "q_1 = offline q_hat"

ablations:   # every proposed component has a matching ablation (stage-18 evidence audit)
  - component: PM1_learned_quantile_predictor
    ablation: "CSF-1 / Mondrian-CSF (no learned predictor, physics formula) vs CertGrip-P (H2-C, mechanism (c))"
  - component: PM2_static_touch_features
    ablation: "CertGrip-S vs CertGrip-P (H4a); shuffled-touch control CertGrip-shuffled (H4c); family-ID control D_FID (H4b)"
  - component: PM3_probe_squeeze_features
    ablation: "CertGrip vs CertGrip-S (H4a)"
  - component: PM4_conformal_calibration
    ablation: "RAW-Q, RAW-Qv, RAW-G (H1c), all alpha, n_cal 50 and 500"
  - component: PM5_disturbance_stratification
    ablation: "pooled (unstratified) calibration of CertGrip: label-rule slip rate per stratum and RE (secondary, reported with H2-x; added at stage 9)"
  - component: PM6_multiplicative_score
    ablation: "additive score s = F*_hi - g_tau(x) on the same models: RE and per-mass-tertile slip rate (secondary, added at stage 9; no extra simulation)"
  - component: PM7_score_space_tracking
    ablation: "Frozen-CertGrip (no update) and ACI level-space update (E2, incl. saturation count)"
  - component: PM8_constant_step
    ablation: "decaying-step OQT (H3-S); eta x {0.5, 2} sensitivity (exploratory, stream replays only; added at stage 9)"
  - component: PM9_anti_windup
    ablation: "OQT without anti-windup on S1/S3 streams: capped-step count and window slip rate (exploratory, added at stage 9)"
  - component: PM10_warm_start
    ablation: "q_1 = 0 cold start (E5a-related, exploratory, added at stage 9)"

metrics:
  RE: "mean over test instances of (F - F*_mid)/F*_mid, signed, slipped instances included (primary efficiency)"
  D: "1 - RE(CertGrip)/RE(COMP), paired on identical instances and the same calibration draw (H2 primary)"
  R_E: "RE_window(OQT-CertGrip)/RE_window(Oracle-CertGrip), window = stream steps 1,001-2,000 (H3 primary)"
  slip_label: "fraction of instances with F < F*_hi (label rule)"
  slip_physical: "fraction slipping in a direct replay at the method's chosen F (H1-V audit)"
  monotonicity: "fraction of instances with a non-monotone slip outcome on the 35-point force grid (H1-M gate: <= 7 of 800, upper limit <= 2 %)"
  audit_gap: "slip_physical - slip_label on the same instances (H1-V: upper limit <= 0.02 at alpha 0.10)"
  tail: "95th percentile of relative excess (H2-T)"
  online_identity: "sum over uncapped steps (slip - alpha) - (q_{T+1} - q_1)/eta (must be 0 to float precision, UT4)"
  latency: "wall time per force decision on CPU (median, 1,000 calls)"
  inference: "object-cluster bootstrap, 2,000 draws; TOST for equivalence claims; CI* = 96.7 % for core decisions"

risks:
  - risk: "slip non-monotone in force (MuJoCo soft contacts, ejection, wedging)"
    mitigation: "H1-M gate on 800 instances before H2/H3; fallback conformal risk control for non-monotone losses (angelopoulos2026conformal), funded from slack"
  - risk: "replay cost c >> 1 CPU-s or non-deterministic replays on runners"
    mitigation: "pilot timing + UT6 bit-identical check on the runner image; 7-step downscale order (07_hypotheses §7); retarget rather than run underpowered"
  - risk: "touch acts as a family identifier, not contact information"
    mitigation: "H4b (both arms given family ID), D-FID diagnostic, shuffled-touch control"
  - risk: "gain set by design ranges (mu, amplitude) rather than method"
    mitigation: "oracle ceiling + gap closed G, H2-R nested sub-pools"
  - risk: "cap binding under shifts (F* > F_max) invalidates the online bound"
    mitigation: "UT8 (<= 1 % per pool) by choosing F_max / m_max in the pilot; capped steps counted, never excluded"
  - risk: "split leakage"
    mitigation: "disjoint object IDs and salts per split, unit test UT1"
  - risk: "sim-only evidence; offline calibration needs F* labels unavailable on hardware"
    mitigation: "claim scoped to simulation; online OQT stated as the deployable route; limitation in the paper"
  - risk: "Actions runners shared with paper 1 (20-job cap)"
    mitigation: "short shards (<= 25 min, time guard), dispatch in waves, sandbox for analysis-only work"

compute_budget:
  assumption: "c = 1 CPU-s per replay (pilot: measured on the runner image)"
  replays: {id_labels: 88000, shift_labels: 88000, monotonicity_grids: 38500, offline_audits: 12000, stream_audits: 4000, ramp_down_E5b: 2000}
  cpu_hours: {simulation: 64.5, training_conformal_bootstrap: 3, pilot: 5, subtotal: 72.5, slack_25pct: 18, total: 90}
  execution: "free GitHub Actions runners via experiments.yml (workdir papers/p2/code), <= 25-min shards with time_guard; ~5-6 h wall at 20 runners if the queue is free (shared with paper 1)"
  restricts_note: "exceeds RESTRICTS budget_total_hours 12 under a CPU-hour reading; paper 1's convention (wall-clock of parallel runners) applies and is recorded in PROGRESS; any overrun is logged, never silent"
  downscale_order: "07_hypotheses §7 steps 1-7; never cut H1-M n=800, the H1-V primary audit, test < 100 objects per family, or any of S1/S2/S3"
