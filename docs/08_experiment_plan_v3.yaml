# Stage 9 · EXPERIMENT_DESIGN [GATE] · v3  (after PIVOT 15 → 8; supersedes docs/08_experiment_plan_v2.yaml for v3)
# Produced with pipeline/references/stage_prompts/experiment_design.md; system role "You are a principal investigator
# designing ML experiments."; {preamble} = "This is iteration v3; previous results showed that (a) one-step look-ahead
# headroom over cost-aware greedy G* under travel cost is small on the 32x8 action set (G(12) = 0.0146, UB 0.0208; Idea 2
# refuted in the tested range) and (b) an RL-trained amortized policy on the ball-sPCE objective fails learnability
# against G* (S12 success 0.204 -> 0.243 after the one remedy vs G* 0.410 on 500 validation episodes). Details:
# results/v2/14_analysis.md and results/v2/15_decision.md (area-chair wording in 14_analysis is binding for any v2
# number)."; {hypotheses} = docs/07_hypotheses_v3.md (canonical; section numbers below refer to it).
# Binding pre-registration: docs/07c_amendment_v3_0.md (commit a1de0fc). Where this file and the amendment differ, the
# amendment wins; this file adds no rule, threshold or row. Inconsistencies found between the hypotheses and the
# amendment are listed under consistency_notes; they are RESOLVED by docs/07c_amendment_v3_1.md (D1-D10, written in run 5
# before any v3 run), which is binding together with v3.0.
# Every number here is a design parameter, a pre-registered threshold, or a cited measured/planning estimate
# ([measured, source] / [planning, source] / [derived] = arithmetic on quoted numbers). None is a result.

version: v3
generated: "2026-10-29"
hypotheses_doc: docs/07_hypotheses_v3.md
theory_doc: docs/07b_theoretical_bounds_v3.md
preregistration: "docs/07c_amendment_v3_0.md (commit a1de0fc; status notes with n*, tau_kappa, delta_c, epsilon_c, H-star, R_b, H1-fb activation, test sizes are appended after the gates, each with a data commit hash)"
amendments_inherited: "docs/07c_amendment_v1_1.md, docs/07c_amendment_v2_0.md (B6 estimator, B8 evaluator), as referenced by 07_hypotheses_v3 §1.1"
v2_numbers_rule: "Every v2 number quoted anywhere in v3 uses the area-chair wording of results/v2/14_analysis.md (rows 1-17); all v2 learned-policy numbers are validation/pilot; kappa = 0/6 diagnostics and relative-head seeds 400-402 are exploratory (amendment C14)."
global_settings:
  action_set: "64 phi' (5.625 deg, phi' = i*2pi/64) x 8 psi in {-35, -25, ..., +35} deg = 512 actions, index a = i_phi*8 + i_psi; every v3 job sets TOUCHBED_NPHI=64 and records it in its output JSON (an output without it is not a v3 result); default 32 must reproduce v2 bit-for-bit (amendment C1)"
  candidate_subsets: "C = 512 (all); 128 = rung_subset(32, 4) (every 2nd phi', psi idx 0,2,5,7); 32 = rung_subset(16, 2) (every 4th phi', psi idx 2,5) (C1)"
  evaluator: "gridpost.AdaptiveGridPosterior, sub = 4 (B8); MAP identity, Nelder-Mead pose, ball mass floored at 1/(2*32,000); histories rebuilt exactly from recorded actions and observation streams; tie band [0.45, 0.55] pre-registered (C2); sub = 8 for every v3 number if E' fails"
  cells: "primary {S0, S12, A12}; kappa_hi = 12; no kappa = 6 cells; A0 re-checked once at G5' under v2 §1.7, enters as 4th primary cell only if informative (C3)"
  informative_cell_rules: "I1 (pre-test removal from success and BI), I2 (on-test non-informative success -> decided on BI, labelled), I3 (H1 'decided on success' iff >= 2 I1-surviving cells are success-informative on test); no other rule (07_hypotheses_v3 §1.4, C3)"
  travel_model: "c(a) = 1 + kappa*|wrap(phi' - phi_t)|/pi strokes; feasible iff c(a) <= tau_rem; episode ends at tau_rem < 1; tau_kappa probe-matched per cell; n* per set by the kappa = 0, tau = 4 rule (v2 §1.2, C4)"

objectives:
  - id: O1
    hypothesis: H1a
    statement: "A DAgger-distilled, belief-free, finger-relative student is non-inferior to full-size cost-aware ball greedy G* (2,000, 512, 64): in every success-informative cell one-sided 95% LB of success(student) - success(G*) > -delta_c (delta_c = min(4 pp, 0.15*D_c)); in every I1-surviving cell LB of BI(student) - BI(G*) > -epsilon_c; >= 4 of 5 seeds with point Delta_success > -delta_c in every success-informative cell."
  - id: O2
    hypothesis: H1b
    statement: "At its own accuracy the student is >= 100x cheaper per decision than the best greedy configuration: in every success-informative cell UB of success(R_b) - success(student) < 0, R_b fixed by the §1.8 rule in Lat' before test (or 'grid floor' (125, 32, 4)). The 100x is per decision and a constants statement at these sizes, not an asymptotic separation (C11; 07b_theoretical_bounds_v3 §2.3)."
  - id: O3
    hypothesis: H1c
    statement: "Learning is needed: in every cell where H1a passes on success, UB of success(H-star) - success(G*) < -delta_c on the first 500 test episodes (all 1,000 if the pilot gap G* - H-star < 12 pp). Outcomes pass / flat / unresolved per §3.1."
  - id: O4
    hypothesis: "H1-fb (conditionally registered fallback)"
    statement: "Active only if Lat' median L_dec(G* full)/L_dec(pruned-16) >= 10. Then: pruned-16 (student top-16 + G* re-scoring) NI to G* by the H1a rules and latency-ratio LB >= 10 on 500 test decisions; control random-16 UB(success(random-16) - success(G*)) < -delta_c, else the word 'learned' is dropped."
  - id: O5
    hypothesis: H2
    statement: "On the first 500 S12 test episodes with the same per-episode contrastive draws (L = 4095, J = 16): one-sided 95% crossed-bootstrap LB of g_T(student, seeds 501-503) - g_T(RL-relative, seeds 511-513) > +0.10 nats (PPO under-optimises its own objective at 2e5 episodes). Encoder sentence only under the label-fit and belief-input (D3-B) conditions of §3.3."
  - id: O6
    hypothesis: H3
    statement: "One-step rollout headroom over G* with the C12 reduced greedy completion is small on 64x8: one-sided 95% UB of G(12) < 0.03 (set S, n* re-calibrated). Regions Kill (LB > 0.05, precedence) / Hold (UB < 0.03) / Inconclusive; Hold downgraded if G1'(c) fails or the bias-check ratio > 1.02; untested if G1'(a) or (b) fails."

datasets:
  - name: shapes_S
    generator: "code/touchbed/shapes.py::make_set_S() (unchanged from v2)"
    cells: [S0, S12]
  - name: shapes_A
    generator: "code/touchbed/shapes.py::make_set_A(0, 8) (unchanged; v2 per-shape confusability rule)"
    cells: [A12, "A0 (re-check only)"]
  - name: notch_control
    generator: "code/touchbed/shapes.py::make_positive_control(); code/touchbed/notch.py exact values (G1'(a), 5 runs)"
  - name: travel_notch_control
    generator: "new in stage 10 (G1'(c)): notch geometry, actions on the stand-off circle, kappa such that the identity feature is far from the cheap action; exact values by enumeration, T = 2"
  - name: zero_gap_bank
    generator: "100 beliefs from split bank3 (salt 101) (G1'(b))"
  - name: travel_environment
    description: "Finger on the 100 mm stand-off circle; 512-action set (global_settings); cost c(a); budget tau_kappa per cell from Cal'."
  - name: episode_splits
    description: "New splits added to evaluate.SPLIT_SALT (existing entries unchanged); episode i of split s on set X uses stream('state', X, s, salt, i), disjoint from v2 by key (C5). Paired designs use the same indices for every method in a cell."
    splits:
      - {split: cal3, salt: 61, size_per_cell: 200, use: "Cal' (n*, tau_kappa)"}
      - {split: pilot3, salt: 67, size_per_cell: "G* 500; random 200; each heuristic 200; greedy-grid candidates 200 (S12 only); 64x16 report 300 (S12, G* only)", use: "G5', margins, H-star, R_b, E' (first shard)"}
      - {split: val3, salt: 71, size_per_cell: 500, use: "D3 (500); D3-B (first 300); held-out regret beliefs for noise floor (200)"}
      - {split: test3, salt: 79, size_per_cell: "1,000 paired (indices 0-999); power rule -> 2,000 (indices 1,000-1,999) in <= 2 cells", use: "H1a, H1b, G*; subsets: first 500 H-star (H1c) and H2 g_T; first 300 BC / abs-frame / RL success / Gen-kappa rows; first 200 success-vs-probe curve; first 100 random sanity"}
      - {split: label3, salt: 83, size_per_cell: "1,500 round-0 G* rollouts (indices 0-1,499; 1,200-1,499 = held-out validation-regret set)", use: "round-0 distillation data"}
      - {split: dagger3, salt: 89, size_per_cell: "400 student rollouts per seed per round, index 1,000*r + 400*(seed-501) + j (C7, see consistency_notes N1)", use: "DAgger rounds 1-2"}
      - {split: g2v3, salt: 97, size_per_cell: "100 beliefs per kappa in {0, 2, 12} (set S)", use: "H3 / G2'"}
      - {split: bank3, salt: 101, size_per_cell: 100, use: "G1'(b) zero-gap bank"}

baselines:
  - name: G_star
    description: "Cost-aware ball greedy: argmax over feasible a of EIG_B(a; b)/c(a), online PF N = 2,000 (resample-move, 3 MH), M = 64, all 512 actions (policies_v2.GStar). Teacher and comparator in every H1 contrast; score_vector() exports s(a) = max(0, EIG_B)/c(a)."
    tuning_protocol: "No tuning in v3 by design: full size (2,000, 512, 64) frozen in v2 §1.4; action set fixed by the pre-registered G5 flatness consequence (C1). Its accuracy-latency trade-off is swept explicitly by the 27-configuration grid (next entry). 64x16 vs 64x8 at S12 on 300 pilot episodes is report-only."
  - name: greedy_grid_27_and_R_b
    description: "27 configurations N in {2,000, 500, 125} x C in {512, 128, 32} (nested subsets) x M in {64, 16, 4}; per-decision latency components t_assim, t_nb, t_score, t_select. R_b = the boundary configuration: Q = configs with median L_dec <= 100 x median L_dec(student); keep maximal elements of Q under componentwise order on (N, C, M) (<= 7); R_b = highest success on 200 S12 pilot episodes (ties -> higher median L_dec); empty Q -> R_b = (125, 32, 4) 'grid floor'."
    tuning_protocol: "Full factorial grid of 27 configurations timed in Lat' (all, interleaved, same decision states); accuracy sweep of the <= 7 maximal qualifying configurations on 200 S12 pilot episodes each; R_b frozen in a status note before any test episode. No post-test change of R_b (§5)."
  - name: H_star_heuristics
    description: "B-spread (belief-free, max-min wrap distance, psi = +5 deg), B-fan (belief-free, stay at phi_t, psi cycle +-5, +-15, +-25, +-35), B-cov (CoverageV2, PF N = 2,000), all with the budget reservation rule c(a) <= tau_rem - max(0, n* - t - 1), fallback cheapest feasible. H-star(c) = best of the three per cell."
    tuning_protocol: "Parameter-free rules frozen in C10; the selection among the three is the sweep: each run on 200 pilot3 episodes per cell, H-star(c) = highest pilot success (ties B-spread < B-fan < B-cov), frozen at the G5' status note before test."
  - name: random
    description: "Uniform over the feasible part of the 512-action set (policies_v2.RandomV2); sanity row and D_c anchor."
    tuning_protocol: "None (parameter-free)."
  - name: RL_relative
    description: "PPO sPCE-total (gamma = 1, returns-to-go of ball-sPCE increments, L = 4095, J = 16), finger-relative RelDeepSets head, 512 actions, E_train = 2e5 episodes; v2 plateau rule (validation ball-sPCE on 500 episodes every 1e4 episodes, 5-eval moving average < 0.02 nats) recorded but not used to stop early. Seeds 511-513, S12 only (H2)."
    tuning_protocol: "Amendment v3.1 D9 (replaces the original no-sweep text): 4-config PPO sweep at S12, seed 519, E_train = 5e4 each, selected on RL's own objective (final validation ball-sPCE of the argmax policy, 500 val3 episodes; ties within 0.02 nats -> lower index); configs = v2 hp1 (lr 3.63e-4, entropy 1.33e-4, batch 128, critic lr 1.43e-3), lr x 1/3, lr x 3, entropy x 10; selected config for seeds 511-513 at E_train = 2e5. Equal sweep size to the student (4 configs, 1 seed)."
  - name: pruned_16_and_random_16
    description: "H1-fb only (if active): G* full size re-scoring only the student's top-16 feasible actions; control: G* re-scoring 16 feasible actions drawn uniformly per decision."
    tuning_protocol: "k = 16 fixed, no k sweep (§3.2); activation decided by measured Lat' ratio before any accuracy number; uses the frozen main students."

proposed_methods:
  - name: distilled_student
    description: >-
      Finger-relative DeepSets (relframe.RelDeepSets, context dim 5, hidden 128 as v2) over 512 relative actions with
      feasibility mask; belief-free input (touch history, finger angle, tau_rem/tau). Loss = CE(logits, softmax(beta_T *
      s/sigma_s) over feasible a) + lambda * CE(logits, argmax s); sigma_s = per-decision SD of s over feasible a; uniform
      over the argmax set if sigma_s < 1e-6. Data: round 0 = 1,500 G* rollouts per cell (label3 0-1,499, every decision
      labelled, shared by seeds; 1,200-1,499 held out); DAgger round 1 = 400 student rollouts per seed with beta_DAgger =
      0.5, round 2 = 400 with beta_DAgger = 0; G* labels (N = 2,000, M = 64) at every visited belief; aggregated; each
      round restarts from previous weights. Stop: validation R-bar every epoch, stop if improvement < 0.005 over 3
      evaluations, cap 50 epochs, last checkpoint, no success-based selection. Adam, no weight decay, grad-norm clip 1.0.
      HP grid (seed 501, S12, round 0, held-out R-bar, ties within 0.01 -> lower index): config 0 (lr 1e-3, beta_T 4,
      lambda 0.5, batch 256), 1 (3e-4, 4, 0.5, 256), 2 (1e-3, 16, 0.5, 256), 3 (1e-3, 4, 0, 512); the chosen config is
      used in every cell and row. Seeds 501-505 per primary cell (S12 501-503 = D3 students, reused). One model per cell.
    tuning_protocol: "4-config HP grid above, 1 seed, selected on held-out round-0 floored normalised regret before DAgger (C7)."
    effective_components:
      - {id: C1, name: "supervised distillation from G*'s score vectors (dense per-decision labels) instead of RL on the policy's own objective", ablation: [A1], hypothesis: H2}
      - {id: C2, name: "DAgger on-policy relabelling (rounds 1-2) instead of behaviour cloning on teacher rollouts", ablation: [A2]}
      - {id: C3, name: "finger-relative action/history frame", ablation: [A3]}
      - {id: C4, name: "belief-free input (no particle filter at decision time)", ablation: [A4]}
      - {id: C5, name: "soft-label target softmax(beta_T*s/sigma_s) with lambda-weighted argmax term", ablation: [A5], claim_scope: "regret sensitivity only (see A5 and consistency_notes N6); no task-metric claim"}
      - {id: C6, name: "amortization (one forward pass replaces online PF + EIG scoring)", ablation: [A6], hypothesis: "H1b (+ full-size latency ratio, report-only)"}
      - {id: C7, name: "learned action selection (vs non-learned heuristics)", ablation: [A7], hypothesis: H1c}
      - {id: C8, name: "learned candidate ranking used for pruning (H1-fb only, if active)", ablation: [A8], hypothesis: "H1-fb control"}
      - {id: C9, name: "one-step greedy teacher (no look-ahead) as the distillation target", ablation: [A9], hypothesis: "H3 (teacher-level, BI not success)"}
      - {id: C10, name: "per-cell training (one student per (set, kappa))", ablation: [A10], claim_scope: "wording rule only: 'transfers to kappa = 0 without retraining' iff Gen-kappa success LB > -delta_S0"}
    not_claimed_as_effective: "beta_DAgger schedule (0.5 -> 0), round sizes, stop rule, regret-based HP selection, hidden width, cost-awareness of the teacher (c(a) division): fixed design choices with no ablation row; the paper must not call them effective, key or important (hard_constraints §3)."

