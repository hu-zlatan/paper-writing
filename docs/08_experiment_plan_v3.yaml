metrics:
  - name: success
    formula: "1[identity correct AND ||(dx, dy)|| < 5 mm AND symmetry-folded rotation error < 5 deg] using the evaluator estimate (MAP identity, Nelder-Mead pose, 30 iterations)"
    code: "touchbed/pf.py::success(lib, AdaptiveGridPosterior.estimate(), s0), via gridpost.GridPosterior.readout"
  - name: ball_information_BI
    formula: "log max(P_hat(B(s0) | h), 1/(2*32,000)) - log P(B(s0)) nats; P(B) from the prior (cap -log P(B) ~ 8.10 nats [07b §1]); P_hat = evaluator ball mass"
    code: "touchbed/gridpost.py::GridPosterior.readout (ball_info), evaluate_v2.prior_ball_mass"
  - name: error_components
    formula: "identity error rate; translation error ||(dx, dy)|| mm; folded rotation error deg (reported)"
    code: "touchbed/pf.py::success output dict"
  - name: executed_probes_and_travel
    formula: "number of probes executed before tau_rem < 1; travel = sum_t |wrap(phi'_t - phi_{t-1})| rad per episode"
    code: "touchbed/travel.py::TravelState.step (episode record)"
  - name: paired_difference_and_bounds
    formula: "per episode, seed-averaged outcome difference (method - comparator); crossed episode x seed bootstrap, B = 10,000, one-sided 95% percentile LB/UB; intersection-union across cells (H1a, H1b, H1c)"
    code: "touchbed/stats.py::crossed_bootstrap_diff; seed rule touchbed/stats.py::seed_robustness"
  - name: reported_row_p_values
    formula: "two-sided bootstrap p-values, Holm within {student vs BC, vs abs-frame, vs random per cell}; TOST of student vs G* at +-delta_c (report-only)"
    code: "touchbed/stats.py::holm, touchbed/stats.py::tost"
  - name: margins
    formula: "D_c = success(G*) - success(random) on pilot3 (G* 500, random 200); delta_c = min(0.04, 0.15*D_c); D_c^BI = BI(G*) - BI(random); epsilon_c = min(0.05*BI_c(G*), 0.15*D_c^BI) nats"
    code: "new analysis script for G5' (stage 10), values in an amendment status note"
  - name: D3_rule
    formula: "(i) Delta_hat_succ >= max(-0.02, -delta_S12 + 1.645*SE_s*sqrt(500/1,000)); (ii) Delta_hat_BI >= max(-0.15, -epsilon_S12 + 1.645*SE_BI*sqrt(500/1,000)); (iii) every seed's point Delta_hat_succ > -delta_S12; SE from the crossed bootstrap on the 500 val3 episodes x 3 seeds"
    code: "touchbed/stats.py::crossed_bootstrap_diff (SE from bootstrap replicates)"
  - name: ball_sPCE_g_T
    formula: "g_T = log((1/J) sum_j p(h_T | s_j^B)) - log((1/(L+1)) [ (1/J) sum_j p(h_T | s_j^B) + sum_{l=1..L} p(h_T | s_l) ]), s_j^B ~ uniform in ball B(s0) (J = 16), s_l ~ prior (L = 4,095), same per-episode draws for every method"
    code: "touchbed/train_v2.py::TrainerV2.rollout (g_T), ball.sample_in_ball; v3 evaluation wrapper on fixed test3 draws (stage 10)"
  - name: floored_normalised_regret
    formula: "r = (s_max - s(a_pi)) / max(s_max - s_med, rho*s_max), rho = 0.05, s_med = median of s over feasible a; decisions with s_max = 0 excluded and counted; R-bar = mean r; tie decision iff s_max - s_med < rho*s_max (fraction reported); r <= 20 by construction"
    code: "new distill.py regret function (stage 10; unit-tested in G0') on GStar.score_vector() output"
  - name: teacher_noise_floor_and_near_ties
    formula: "R-bar of G*'s own first choice re-scored with an independent RNG stream on 200 val3 beliefs; fraction of decisions with (s_max - s_(2))/s_max < 0.05"
    code: "distill.py (stage 10) + policies_v2.GStar.score_vector()"
  - name: label_fit
    formula: "training-set R-bar and top-1 agreement with argmax s at end of round 2; under-fit := R-bar > 0.25 or top-1 < 0.50 (labelling rule of §3.3, not a prediction)"
    code: "distill.py (stage 10)"
  - name: decision_latency_L_dec
    formula: "median over >= 500 timed decisions (after 20 warm-up) of time from receiving y_t to emitting a_{t+1}; greedy = t_assim + t_nb + t_score + t_select; student = t_feat + t_fwd + t_mask; one pinned core, OMP/MKL/OPENBLAS threads = 1, interleaved; bootstrap 95% CI of the median; +500 decisions if any CI half-width > 10% of its median; selection-only time also reported"
    code: "touchbed/latency.py::run_latency extended with component timers (stage 10; G0' check: components sum to L_dec within 5%)"
  - name: episode_latency_L_ep
    formula: "sum of L_dec over the episode + L_final; L_final(student) = one PF (N = 2,000) pass over the history + MAP identity + 30 Nelder-Mead iterations; L_final(greedy) = read-out only; evaluator excluded"
    code: "touchbed/latency.py (stage 10 extension)"
  - name: latency_ratio
    formula: "median L_dec(A)/median L_dec(B) with bootstrap over decisions; H1-fb: one-sided 95% LB of median ratio G*/pruned-16 on 500 test decisions"
    code: "new ~10-line ratio bootstrap (stage 10)"
  - name: implementation_independent_counts
    formula: "likelihood evaluations per greedy call M*N*C + N*C; student MACs; cProfile share of L_dec inside vectorised numpy kernels"
    code: "touchbed/latency.py::lik_evals_rung(N, C, M); touchbed/latency.py::macs_policy(hidden, n_touch, ctx_dim=5, n_act=512)"
  - name: break_even_episodes
    formula: "training CPU time incl. G* labelling / (per-episode G* time - per-episode student time)"
    code: "analysis script (stage 14) from job CPU logs"
  - name: H3_relative_gap
    formula: "G(kappa) = [mean V_LA - mean V_G*] / mean V_LA over 100 G*-reached beliefs (dimensionless; V in nats of expected remaining-budget ball information); one-sided 95% bounds by bootstrap over beliefs of the ratio of means; absolute nats reported"
    code: "touchbed/g2.py::g2_gap -> touchbed/lookahead.py::lookahead_gap(..., greedy_M=0) with lookahead_tb.TouchbedProblem (M = 16, rung (16, 8)); analysis_g2.py"
  - name: H3_bias_check
    formula: "ratio of estimator V_G* to an independent 4x-sample full G* rollout estimate on 20 S12 beliefs; > 1.02 -> 'Hold' unavailable"
    code: "stage 10 script around g2.py"
  - name: gap_closure_H2
    formula: "[success(student) - success(RL)] / [success(G*) - success(RL)], reported only if LB(success(G*) - success(RL)) > delta_S12"
    code: "stats.crossed_bootstrap_diff + analysis script"
  - name: E_prime_evaluator_check
    formula: "mean |BI(sub 4) - BI(sub 8)| over 16 episodes; success flips counted only if true-identity mass outside [0.45, 0.55] under both settings"
    code: "gridpost.AdaptiveGridPosterior(sub=4 / sub=8)"
  - name: compute_accounting
    formula: "CPU-h per job from runner logs; TIME_ESTIMATE line per sweep"
    code: "main.py pilot (TIME_ESTIMATE), touchbed/time_guard.py"

statistical_tests:   # 07_hypotheses_v3 §1.9 = C13; no correction across H1, H2, H3; IU within each
  - {claim: H1a, test: "crossed bootstrap of paired Delta (student - G*), success and BI, per cell; IU", rule: "LB > -delta_c (success), LB > -epsilon_c (BI); seed rule >= 4/5"}
  - {claim: H1b, test: "crossed bootstrap of success(R_b) - success(student), one-sided UB per cell; IU", rule: "UB < 0"}
  - {claim: H1c, test: "paired episode bootstrap of success(H-star) - success(G*), one-sided UB, cells where H1a passes; IU", rule: "UB < -delta_c"}
  - {claim: H1-fb, test: "as H1a for pruned-16; median-ratio bootstrap", rule: "NI as H1a; ratio LB >= 10"}
  - {claim: "H1-fb control", test: "as H1c for random-16", rule: "UB < -delta_c"}
  - {claim: H2, test: "crossed bootstrap of g_T(student) - g_T(RL), S12", rule: "LB > +0.10 nats"}
  - {claim: H3, test: "bootstrap over beliefs of the ratio of means G(12)", rule: "Kill LB > 0.05 (precedence); Hold UB < 0.03; else Inconclusive"}
  - {claim: "reported rows", test: "two-sided bootstrap p, Holm within {student vs BC, vs abs-frame, vs random per cell}", rule: "reported only"}
  - {claim: secondary, test: "TOST student vs G* at +-delta_c per cell", rule: "reported only"}

pre_run_gates:   # §4; no main run before G0', Cal', E', G5', Lat' and D3 pass; G1'/G2' do not block H1
  - id: "G0'"
    date: "2026-11-05"
    check: "CI unit tests: 64x8 masks and costs; 32x8 bit-reproduction (v2 kappa = 0/tau = 3 set, rung_subset); relative <-> absolute round trip on 512; soft-label CE gradient check; score_vector() argmax = GStar.act on the same RNG state; regret floor and tie handling; heuristic determinism and reservation rule; latency component timers sum to L_dec (+-5%); analysis_g3_notch.py and analysis_g3_hp.py reproduce or diff the v2 files; TIME_ESTIMATE pilots (<= 5 min each)"
    pass_rule: "all green, commit hash recorded"
    if_fail: "nothing downstream starts; not green by 11-07 -> buffer consumed; by 11-09 escalate to owner"
  - id: "Cal'"
    date: "2026-11-06"
    check: "n* (kappa = 0, tau = 4 rule) and tau_kappa for S0, S12, A12 (+ A0 recheck), 200 cal3 episodes each"
    pass_rule: "verified mean probes within n* +- 0.3"
    if_fail: "<= 3 bisection steps on tau_kappa; then the cell is removed (I1)"
  - id: "E'"
    date: "2026-11-07"
    check: "sub 4 vs sub 8 on 8 S12 + 8 A12 pilot episodes (4 G*, 4 B-fan each, first G5' shard)"
    pass_rule: "mean |Delta BI| <= 0.02 nats AND no success flip outside the tie band [0.45, 0.55]"
    if_fail: "sub = 8 for every v3 number; its measured cost enters the downscale order"
  - id: "G1'"
    date: "2026-11-07"
    check: "(a) notch, 5 runs; (b) zero-gap bank, 100 bank3 beliefs; (c) travel-notch, exact values by enumeration, T = 2"
    pass_rule: "(a) mean relative gap in [0.573, 0.860] (every run reported); (b) mean in [-0.01, +0.02] and UB < 0.03; (c) exact relative gap >= 0.10 and estimate within +-20% of it"
    if_fail: "(a)/(b) -> H3 untested on 64x8 (only 32x8 values with flatness caveat); (c) fails or not built by 11-05 -> H3 'Hold' unavailable"
  - id: "G5'"
    date: "2026-11-09"
    check: "G* 500, random 200, B-spread/B-fan/B-cov 200 pilot3 episodes per primary cell; v2 §1.7 non-degeneracy; margins delta_c, epsilon_c; H-star; 64x16 report at S12 (300); A0 informativeness"
    pass_rule: "success(G*) >= success(random) + 10 pp AND §1.7 (success(G*) in [0.15, 0.90], D_c >= 20 pp, BI saturation < 50%) per cell"
    if_fail: "cell removed (I1); < 2 cells survive -> H1 proceeds labelled per I3. Flat' screen: H-star point success >= G* - delta_c in >= 2 cells -> owner told on 11-12 that row 1' is likely; runs proceed unchanged"
  - id: "G2'"
    date: "2026-11-10"
    check: "H3 measurement (3 kappa x 100 g2v3 beliefs) + bias check (20 S12 beliefs)"
    pass_rule: "finding either way (Kill / Hold / Inconclusive regions; downgrades per G1'(c) and bias ratio > 1.02)"
    if_fail: "does not block H1"
  - id: "Lat'"
    date: "2026-11-10"
    check: "§1.8 timing of 27 configs, student (untrained weights suffice), pruned-16, L_final on S12 pilot decisions; R_b selection on 200 S12 pilot episodes; H1-fb activation"
    pass_rule: "protocol complete, every CI half-width <= 10% of its median; H1-fb active iff median L_dec(G* full)/L_dec(pruned-16) >= 10"
    if_fail: "500 more decisions; then R_b and H1-fb activation frozen (H1-fb withdrawn with the x% assimilation + neighbour-list sentence if ratio < 10)"
  - id: D3
    date: "2026-11-12 (remedy re-check 2026-11-14)"
    check: "S12, student seeds 501-503, chosen HP config, full recipe; 500 val3 episodes paired with G*"
    pass_rule: "(i) Delta_hat_succ >= max(-2 pp, -delta_S12 + 1.645*SE_s*sqrt(500/1,000)); (ii) Delta_hat_BI >= max(-0.15, -epsilon_S12 + 1.645*SE_BI*sqrt(500/1,000)) nats; (iii) every seed's point Delta_hat_succ > -delta_S12"
    if_fail: "one remedy: double round 0 and both DAgger rounds once, re-check 11-14; still failing -> H1 dead: H1-fb branch if active, else outcome row 4"
  - id: D3-B
    date: "2026-11-12"
    check: "belief-input student, seeds 521-523, first 300 val3 episodes"
    pass_rule: "same rule as D3 (report-only; feeds only the H2 encoder sentence)"
    if_fail: "no routing"
freeze_commit: "after the gate decision (11-12, or 11-14 with remedy): n*, tau_kappa, informative cells, delta_c, epsilon_c, H-star per cell, R_b, H1-fb activation, power-rule test sizes (projected SE_test > delta_c/2.5 -> 2,000 episodes, <= 2 cells), HP config; each as a dated status note in 07c_amendment_v3_0.md with data commit hash"

outcome_map:   # §5; the owner is told which row occurred; no outcome triggers a fourth design
  - {row: "1", outcome: "H1a, H1b, H1c pass; H3 Hold (+- H2)", statement: "Amortizing cost-aware information-gain touch selection: belief-free student within delta_c of G*, heuristics are not, no greedy configuration within 100x of its per-decision cost is as accurate; one-step rollout gains <= x% over G*; (H2) RL under-optimises its own objective", venue: "RSS Stage 1 main claim"}
  - {row: "1'", outcome: "H1a passes, H1c 'flat' in >= 2 cells", statement: "At this probe budget the task is flat: a simple heuristic is also non-inferior to G*; contribution = measurement (H3, H2) and latency characterisation; learning claim dropped", venue: "workshop / RA-L; owner decides"}
  - {row: "2", outcome: "row 1 but H3 Inconclusive or Kill", statement: "as row 1; measured headroom reported; 'the teacher could be improved' as limitation", venue: "RSS, weaker framing"}
  - {row: "2b", outcome: "H1a passes, H1b fails", statement: "non-inferior, but not >= 100x cheaper than the best greedy configuration at its accuracy; full-size ratio only", venue: "RA-L / workshop"}
  - {row: "3", outcome: "H1 fails (D3 or test), H1-fb active and passes", statement: "Learned candidate pruning for online information-gain touch selection (>= 10x per decision); 'learned' only if random-16 is demonstrably worse; H2, H3 supporting", venue: "RSS short / workshop"}
  - {row: "4", outcome: "H1 and H1-fb fail, or H1-fb withdrawn", statement: "fallback characterisation paper: H3; learnability of RL and distillation with the same encoder with the label-fit / belief-input diagnosis; H2; evaluator observation as a methods note", venue: "owner decision (RSS Stage 1 EA or RA-L / workshop)"}
label_rules:
  - "kappa = 12-only failure (S12, A12) with S0 passing -> 'amortized ball greedy supported without travel; cost-aware amortization rejected'; 'cost-aware' leaves the title"
  - "'near-optimal' may not appear in title or abstract under any outcome"
  - "labels only from: pass / rejected / rejected as titled / flat / unresolved / inconclusive / untested / withdrawn / non-informative cell"
  - "not allowed after the run: switching the selection metric, changing k, H-star or R_b, adding cells or kappa levels, re-running H3 on another grid, choosing between RL and distillation on test data, promoting v2 exploratory seeds"

risks:
  - risk: "Student fails D3 (honest prior: closest learned evidence, RL relative head, is ~12 pp short of G* [exploratory, 12_diag_analysis.json k12.rel_sd400-402]; D3 asks ~ -1.5 pp)"
    mitigation: "one pre-registered remedy (double data), then H1-fb or row 4; both pre-written"
  - risk: "Flat task (heuristic non-inferior to G*)"
    mitigation: "H1c with Flat' screen at G5' and row 1'"
  - risk: "Q non-empty with mid-sized greedy configurations as accurate as the student (07b §2.4 item 2)"
    mitigation: "H1b fails honestly -> row 2b; full-size ratio and Pareto plot still reported"
  - risk: "H1-fb ratio near the 10x threshold (op-count estimate ~11x, 07b §2.4 item 3)"
    mitigation: "activation decided by Lat' measurement only, before any accuracy number; not pre-announced"
  - risk: "Planning latency 1.7 s/decision at 512 is an assumption (2 x informal 0.840 s; not protocol measurements, C14 item 9)"
    mitigation: "TIME_ESTIMATE before every sweep re-measures unit costs; downscale order applied if projection > 150 CPU-h main"
  - risk: "Evaluator sub = 4 inadequate at kappa_hi"
    mitigation: "E' -> sub = 8 with its cost in the downscale order"
  - risk: "H3 estimator over-reads greedy (deflates G)"
    mitigation: "travel-notch G1'(c) and bias check; 'Hold' unavailable if either fails"
  - risk: "Teacher noise (argmax at near-ties) caps achievable agreement"
    mitigation: "noise floor and tie fraction measured; no R-bar threshold is a prediction"
  - risk: "Budget conflict with RESTRICTS.yaml (see compute_budget.restricts_reconciliation) or Actions quota cap"
    mitigation: "main session confirms Actions quota before 11-05; if capped, downscale order first; conflict surfaced to owner, not hidden"
  - risk: "Deadline 2026-12-04 AoE"
    mitigation: "buffer 11-20 -> 11-22; analysis 11-23 -> 11-25; every outcome row pre-written; no fourth design"

