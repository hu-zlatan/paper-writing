    budget_per_run_minutes: "CONFLICT. Jobs are planned at <= 6 h with time_guard at 80%; a single RL run (~4 CPU-h) and the labelling jobs exceed 30 min. Complies only if a 'run' is a shard of <= 30 min (RL would need checkpoint-resume chaining, not specified in the amendment). v2 practice (TrainConfigV2.budget_minutes = 330) already exceeded 30 min. Not resolved here."
    downscale_threshold_minutes: "CONFLICT for the same runs (RL 2e5, round-0 labelling): the pre-registered downscale order never reduces them, while RESTRICTS asks for automatic downscaling of any single run > 45 min. Not resolved here."
