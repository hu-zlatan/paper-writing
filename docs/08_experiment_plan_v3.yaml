  - id: A1
    removes: C1
    variant: "RL-relative: same RelDeepSets head and 512 actions trained by PPO on ball-sPCE (its own objective), E_train = 2e5"
    cells: [S12]
    seeds: "511-513 (vs student 501-503)"
    episodes: "first 500 test3 for g_T (H2 test); first 300 test3 for success/BI (reported row)"
    readout: "H2 test (g_T LB > +0.10 nats); success, BI, probes, gap closure (only if LB(success(G*) - success(RL)) > delta_S12), CPU-h incl. G* labelling"
  - id: A2
    removes: C2
    variant: "BC-only: round-0 checkpoints of student seeds 501-503 at S12 (no DAgger; no separate training, C8)"
    cells: [S12]
    seeds: "501-503 (round-0 checkpoints)"
    episodes: "first 300 test3"
    readout: "success, BI, R-bar; Holm-family reported row; not data-matched to DAgger (1,500 vs 1,500 + 800 rollouts per seed): a BC = DAgger result means the paper does not attribute NI to DAgger specifically (07b §6)"
  - id: A3
    removes: C3
    variant: "absolute-frame student: train_v2.CategoricalDeepSets head, same recipe (round 0 + DAgger 1-2 with its own G* labels), chosen HP config"
    cells: [S12]
    seeds: "531-533"
    episodes: "first 300 test3"
    readout: "success, BI, R-bar; Holm-family reported row; first item of the downscale order"
  - id: A4
    removes: C4
    variant: "belief-input student (D3-B): same head and recipe, input = 48 PF-summary features (per identity k = 1..8: w_k, weighted mean x, y, weighted SD x, y, resultant length of |G_k|*theta) from a PF N = 2,000, plus the relative context"
    cells: [S12]
