    variant: "online greedy without amortization: the 27-configuration (N, C, M) grid, R_b, and full-size G*"
    cells: "Lat' timing on S12 pilot decisions; R_b and G* on all test3 1,000 episodes per primary cell"
    seeds: "deterministic (one RNG stream per episode)"
