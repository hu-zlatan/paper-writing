# Stage 9 · EXPERIMENT_DESIGN [GATE] · v1
# Produced with pipeline/references/stage_prompts/experiment_design.md (system: "You are a principal investigator designing
# ML experiments."), {preamble} = "" (first pass), {hypotheses} = docs/07_hypotheses.md. Session model, 2026-10-28.
# Every number below is a design parameter, not a result. All results must come from code/ runs written to results/.
# Changes vs docs/07_hypotheses.md are listed under `deviations_from_hypotheses_doc` with reasons.

version: v1  # amended 2026-10-28 by docs/07c_amendment_v1_1.md (L=4095, ball information co-primary, PF proposal, costs, no GRU)
generated: "2026-10-28"
hypotheses_doc: docs/07_hypotheses.md
theory_doc: docs/07b_theoretical_bounds.md

deviations_from_hypotheses_doc:
  - id: D1
    what: "Main contrastive-sample count L is selected by a pre-registered pilot rule from {255, 1023, 4095} instead of being fixed at 255."
    why: "sPCE <= log(L+1) (docs/07b_theoretical_bounds.md §4.1). L=255 caps the bound at 5.55 nats, below the ~8.1 nats the success criterion needs, so the training signal could saturate and confound H1a/H2."
    rule: "Train one pilot sPCE-total run per L on S for 1e5 episodes; main L = the smallest L whose fraction of T=10 training episodes with g_T > log(L+1) - 0.5 is < 10% at the end of the pilot; if none qualifies, L = 4095 and the saturation fraction is reported as a limitation. The L ablation row keeps {15, 63, 255, 1023, 4095} minus the main L where compute allows."
  - id: D2
    what: "Compute downscale order extended: if main L = 4095 pushes training above 1.5x the estimate, core seeds go 10 -> 6 (H2 seed-robustness rule becomes >= 5 of 6) before any primary episode count is reduced."
    why: "Training cost is linear in L (theory doc §2); RESTRICTS.yaml requires downscaling rather than silently exceeding budget."

objectives:
  - id: O1
    hypothesis: [H1a, H1b]
    statement: "Amortized sPCE-total policy is non-inferior (4 pp margin) to full-size greedy PF-EIG on success and IG_T, beats random/coverage at T<=5, and is >=100x faster per decision than greedy at matched accuracy."
  - id: O2
    hypothesis: [H2a, H2b, H2c]
    statement: "Non-myopic credit assignment (gamma=1) beats the myopic control (gamma=0) on the ambiguous set S at T in {3,5}, through set-up moves (two-step oracle EIG), with the gap shrinking as T grows."
  - id: O3
    hypothesis: [H3]
    statement: "A policy that plans for no-contact outcomes selects better touches on multimodal beliefs than ablations that ignore misses in the objective or in the input."
  - id: O4
    hypothesis: [H4]
    statement: "Policies trained on the geometric probe model keep their advantage under a measured MuJoCo fingertip-contact shift."
  - id: O5
    hypothesis: [H1c, H5prime]
    statement: "Secondary: information objective vs sparse task reward at equal budget; amortization deficit vs library size K."

datasets:
  # All data are generated by code in this repository (no external datasets); provenance recorded in data/README.md.
  - name: shapes_A
    generator: code/touchbed/shapes.py::make_set_A(seed=0)
    content: "K=8 irregular simple polygons, 8-14 vertices, circumradius R=40 mm about centroid, min feature >= 6 mm, trivial symmetry group, pairwise/self confusability <= 0.80"
  - name: shapes_S
    generator: code/touchbed/shapes.py::make_set_S()
    content: "K=8: four near-symmetric bases (2:1 rectangle, rounded equilateral triangle, regular hexagon, isosceles trapezoid) + one variant each with a 6 mm wide, 3-4 mm deep notch/chamfer/bump breaking the symmetry; R=40 mm"
  - name: shapes_A4_A16
    generator: code/touchbed/shapes.py::make_set_A(seed=0, K in {4,16})
    content: "nested libraries for H5prime (A4 subset of A8=A subset of A16)"
  - name: notch_rectangle_control
    generator: code/touchbed/shapes.py::make_positive_control()
    content: "two rectangles identical except a notch; analytic two-step optimum used by H2b-P2"
  - name: manipulation_checks
    description: "Before main runs: confusability C(S)>=0.90, C(A)<=0.80; myopia gap G(S)>=0.10, G(A)<=0.03 on a 100-belief bank per set (nested MC, N=1000, C=32, M=32); NC-relevance R_NC reported. Redesign S if failed."
  - name: episode_sets
    description: "Disjoint fixed-seed sets per (set, T): pilot 200, validation 500, test 2000 (shared by all methods; first 1000 test scenes reused in MuJoCo). Prior: k~U{1..K}, x,y~U[-15,15] mm, theta~U[0,2pi)."
  - name: observation_model
    description: "Probe from 100 mm radius at angle phi, direction phi+pi+psi, psi in [-40,40] deg, 200 mm stroke. Contact point noise sigma_p=1.0 mm, normal noise sigma_n=5 deg, no-contact outcome otherwise. eps-softened likelihood eps=1e-3, one code path for all methods."
  - name: mujoco_scenes
    generator: code/touchbed/mujoco_eval.py
    content: "Extruded polygon (height 30 mm) fixed to the table; spherical fingertip r in {1,4,8} mm (4 primary) moved by position control along the probe line until a touch sensor fires; contact point and normal read from MuJoCo contacts. Shift check: median contact-point error >= 2 mm or >= 5% hit/miss disagreement vs the geometric model at the primary radius."

baselines:
  - name: random
    description: "uniform (phi, psi)"
    tuning_protocol: "none needed (no parameters); one fixed RNG stream per episode"
  - name: coverage
    description: "max-min distance of predicted MAP contact from previous contacts over C=64 Sobol candidates (as in zheng2026bayesian)"
    tuning_protocol: "C in {16, 64, 256} on validation success at T=5; best C fixed"
  - name: greedy_pf_eig
    description: "online PF (resample-move) + one-step MC EIG over C Sobol candidates with M outcome samples; full size N=2000, C=64, M=64"
    tuning_protocol: "18-config Pareto sweep over N in {500,1000,2000} x C in {16,32,64} x M in {16,64}; full size must be within 1 pp of the best config on validation (else the best config becomes 'full size'); the sweep also provides the H1b matched-accuracy configuration"
  - name: rl_success
    description: "same architecture, PPO, sparse terminal reward 1[success] computed by a training PF (N=1000)"
    tuning_protocol: "same 12-config random search (lr, entropy coef, batch size, critic lr) x 1e5 episodes on S, selected on validation success at T=5 — identical to the proposed method"
  - name: rl_pfig
    description: "same architecture, dense reward = per-step increase in PF log-posterior of the true state (estimator comparison, S only, 5 seeds, no confirmatory claim)"
    tuning_protocol: "same 12-config search"
  - name: spce_myopic
    description: "control for H2: identical to sPCE-total except advantage A_t = r_t - V(h_{t-1}) (gamma=0)"
    tuning_protocol: "same 12-config search, same episode budget and plateau rule"

proposed_methods:
  - name: spce_total
    description: "TouchBED: budget-conditioned DeepSets policy pi(a_t | h_{t-1}, T-t+1) trained with PPO (clip 0.2, gamma=1, full returns-to-go, learned critic) on per-step sPCE increments r_t = g_t - g_{t-1} with L contrastive prior samples (L by rule D1)"
    effective_components:
      - id: C1
        name: non_myopic_credit_assignment
        ablation: A1
      - id: C2
        name: planning_for_no_contact_outcomes
        ablation: [A2a, A2b]
      - id: C3
        name: permutation_invariant_history_encoder
        ablation: A3
      - id: C4
        name: contrastive_sample_count_L
        ablation: A4
      - id: C5
        name: budget_conditioning_input
        ablation: A5
    training_budget: "E_train = 4e5 episodes per run (T~U{3,5,8,10}); plateau rule: validation every 2e4 episodes, plateau when 5-eval moving average improves < 0.5 pp; if any method in a comparison has not plateaued at the cap, the cap doubles for all methods in that comparison"
    convergence_check: "real plateau criterion above (no fixed loop without a check); PF and nested-MC loops use ESS-triggered resampling and fixed counts justified by the N vs 4N convergence check"

ablations:
  - id: A1
    removes: C1
    variant: spce_myopic (gamma=0)
    cells: "all (set x T)"
    seeds: 10
  - id: A2a
    removes: C2
    variant: "No-NC-objective (normalized conditional likelihood q; misses carry no likelihood ratio in training rewards)"
    cells: "A and S, T in {3,5,8,10}"
    seeds: 5
  - id: A2b
    removes: C2
    variant: "No-NC-input (miss entries removed from the DeepSets sum)"
    cells: "A and S, T in {3,5,8,10}"
    seeds: 5
  - id: A3
    removes: C3
    variant: "padded-concatenation MLP; GRU"
    cells: "S, all T"
    seeds: 3
  - id: A4
    removes: C4
    variant: "L in {15, 63, 255, 1023, 4095} \\ {main L}"
    cells: "S, all T"
    seeds: 3
  - id: A5
    removes: C5
    variant: "policy without remaining-budget input"
    cells: "S, T in {3,10}"
    seeds: 3

metrics:
  - name: success
    formula: "1[k_hat = k0] * 1[||(x_hat,y_hat)-(x0,y0)|| < 5 mm] * 1[min_{g in G_k0} |wrap(theta_hat - theta0 - g)| < 5 deg]; point estimate = MAP identity, highest-posterior particle refined by 30 Nelder-Mead steps"
  - name: IG_T
    formula: "log p_hat(s0 | h_T) - log p(s0), p_hat = PF identity mass x KDE (1 mm, 1 deg, wrap mod G_k0), floored at 1e-3 p(s0); mean estimates the policy's true total EIG"
  - name: translation_error_mm
    formula: "||(x_hat,y_hat)-(x0,y0)||"
  - name: rotation_error_deg
    formula: "min_{g in G_k0} |wrap(theta_hat - theta0 - g)|"
  - name: identity_accuracy
    formula: "1[k_hat = k0]"
  - name: spce_T
    formula: "g_T with the main L (training-objective value, reported; capped at log(L+1))"
  - name: decision_latency_ms
    formula: "median of 200 timed decisions after 20 warm-ups, 1 core, batch 1, threads=1; greedy includes PF update + scoring; policy includes encoder + head"
  - name: training_cost
    formula: "CPU-hours and likelihood evaluations per run"
  - name: miss_information_share
    formula: "fraction of a chosen probe's one-step EIG contributed by the no-contact outcome branch; and frequency of predicted P(NC) in [0.2, 0.8] (H3-P2)"
  - name: statistics
    formula: "paired comparison over shared test episodes (seed-averaged outcomes), crossed episode x seed bootstrap B=10000, one-sided 95% bounds, Holm for 'at least k' families, intersection-union otherwise, seed robustness >= 8/10 (>= 4/5) — implemented in code/touchbed/stats.py before any claim uses it"

risks:
  - risk: "sPCE saturation at log(L+1) flattens the training signal"
    mitigation: "rule D1 + saturation fraction logged every validation step"
  - risk: "Manipulation check fails (S not ambiguous enough in the decision-relevant sense)"
    mitigation: "redesign S features (deeper / off-centre notches) and re-check before main runs; never run H2 on an unchecked set"
  - risk: "PPO instability / seeds disagree"
    mitigation: "plateau rule, 10 seeds for core contrast, seed-robustness rule; report failures honestly"
  - risk: "Greedy PF-EIG too slow for 2000-episode cells"
    mitigation: "vectorized numpy, sharded over GitHub Actions runners with time_guard; pilot TIME_ESTIMATE first"
  - risk: "NaN/Inf from log-sum-exp of tiny likelihoods"
    mitigation: "log-domain computation with logsumexp and eps-softened likelihood by design; any NaN is a bug traced to root cause (no nan_to_num)"
  - risk: "MuJoCo contact differs too little (trivial transfer) or too much"
    mitigation: "measured shift check, three fingertip radii"
  - risk: "Near precursor appears (2026 arXiv) during the project"
    mitigation: "re-run targeted literature search at stage 23 and before the extended-abstract milestone"

compute_budget:
  hardware: "sandbox 2 vCPU / 7 GB (development, pilots, small runs) + GitHub Actions ubuntu-latest CPU runners (sharded sweeps, <= 5 h per shard with time_guard)"
  estimate_cpu_hours: "~71 at L=255 (docs/07_hypotheses.md §7); training part scales ~linearly in L — re-estimated by the stage-11 pilot TIME_ESTIMATE before any sweep"
  wall_clock_budget: "RESTRICTS.yaml budget_total_hours=12 wall-clock for a full sweep: met only with ~10 concurrent runners; otherwise downscale per D2 and docs/07_hypotheses.md §7 order"
  pilot: "mandatory single-condition pilot printing TIME_ESTIMATE per condition x conditions x seeds"
  scaling_rules: "conditions > 100 -> seeds 3-5 for non-core rows; per-run optimisation capped by episode budget with plateau rule"
